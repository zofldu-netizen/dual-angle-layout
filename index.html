<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual Angle 3D</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  header .t{font-size:13px;color:#aaa}
  header .t b{display:block;font-size:17px;color:#fff}
  .lr{display:flex;border:1px solid #444;border-radius:999px;overflow:hidden;flex-shrink:0}
  .lr button{border:0;background:#222;color:#ccc;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .lr button.active{background:#ffd400;color:#111}
  main{max-width:560px;margin:0 auto;padding:0 12px 20px}
  canvas{width:100%;aspect-ratio:1/1;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .hlrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;margin-top:6px}
  #hlLabel{font-size:14px;color:#ff5252;font-weight:700}
  #hlLabel.hint{color:#888;font-weight:400;font-size:12px}
  .hlrow button{flex-shrink:0;padding:7px 10px;border:1px solid #333;background:#1c2731;color:#ccc;border-radius:8px;font-size:12px;cursor:pointer;touch-action:manipulation}
  .nums{display:flex;align-items:center;gap:8px;margin-top:10px}
  .nums .x{color:#666;font-size:20px;flex-shrink:0}
  .numcard{flex:1;min-width:0;background:#232f3a;border-radius:10px;padding:10px 6px 8px;text-align:center}
  .numcard.hl{outline:2px solid #ff2d2d}
  .numwrap{display:flex;align-items:baseline;justify-content:center;gap:2px}
  .numwrap input{width:2.5em;background:transparent;border:0;color:#fff;font-size:28px;font-weight:700;text-align:center;outline:none;touch-action:manipulation}
  .numwrap .unit{color:#fff;font-size:28px;font-weight:700;flex-shrink:0}
  .numcard small{display:block;color:#8fa0ad;font-size:12px;margin-top:2px}
  .viewrow{display:flex;gap:8px;margin-top:10px}
  .viewrow button{flex:1;border:1px solid #444;background:#1c2731;color:#ccc;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .viewrow button.active{background:#ff2d2d;color:#fff;border-color:#ff2d2d}
  .core{display:flex;gap:8px;margin-top:12px}
  .core button{flex:1;border:1px solid #333;background:#1c2731;color:#ccc;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  .core button.active{background:#ffd400;color:#111;border-color:#ffd400}
  .foot{text-align:center;color:#666;font-size:12px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="t"><b>Dual Angle</b>개인용 · 3D</div>
  <div class="lr"><button type="button" id="lrL">L</button><button type="button" id="lrR" class="active">R</button></div>
</header>
<main>
  <canvas id="ball" width="720" height="720"></canvas>
  <div class="hlrow"><div id="hlLabel" class="hint">공을 드래그하면 돌아가 · 보기 버튼을 누르면 키보드 없이 선만 빨개져</div><button type="button" id="rotReset">회전 초기화</button></div>
  <div class="nums">
    <div class="numcard" id="cardA"><div class="numwrap"><input id="inA" type="text" inputmode="decimal" value="74" aria-label="드릴링 앵글"><span class="unit">°</span></div><small>드릴링 앵글</small></div>
    <div class="x">×</div>
    <div class="numcard" id="cardD"><div class="numwrap"><input id="inD" type="text" inputmode="decimal" value="4.5" aria-label="Pin to PAP"><span class="unit">″</span></div><small>Pin to PAP</small></div>
    <div class="x">×</div>
    <div class="numcard" id="cardC"><div class="numwrap"><input id="inC" type="text" inputmode="decimal" value="35" aria-label="VAL 앵글"><span class="unit">°</span></div><small>VAL 앵글</small></div>
  </div>
  <div class="viewrow">
    <button type="button" id="viewA">드릴링 보기</button>
    <button type="button" id="viewD">Pin to PAP 보기</button>
    <button type="button" id="viewC">VAL 보기</button>
  </div>
  <div class="core">
    <button type="button" id="coreSym">대칭 · CG</button>
    <button type="button" id="coreAsym" class="active">비대칭 · MB</button>
  </div>
  <div class="foot">실제 지공 전 프로샵 확인 · 인치는 공 표면 따라 잰 거리 · PAP는 지금 빼고 그림</div>
</main>
<script>
const $ = id => document.getElementById(id);
const RB = 4.25;
const state = { hand:'R', core:'asym', A:74, D:4.5, C:35, highlight:null, rotY:null, rotX:0 };
const KEY = 'dual-angle-layout-3d-v2';
try{
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(s) Object.assign(state, {hand:s.hand||'R', core:s.core||'asym', A:s.A??74, D:s.D??4.5, C:s.C??35});
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({hand:state.hand, core:state.core, A:state.A, D:state.D, C:state.C})); }catch(e){} }
const rad = d => d*Math.PI/180;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const V = (x,y,z) => ({x,y,z});
const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
const cross = (a,b) => V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const norm = a => { const l = Math.hypot(a.x,a.y,a.z)||1; return V(a.x/l,a.y/l,a.z/l); };
const scale = (a,s) => V(a.x*s,a.y*s,a.z*s);
const add = (a,b) => V(a.x+b.x,a.y+b.y,a.z+b.z);
function move(p,t,dist){ const a = dist/RB; return norm(add(scale(p,Math.cos(a)), scale(t,Math.sin(a)))); }
function tangentTo(a,b){ return norm(add(b, scale(a,-dot(b,a)))); }
function rotTangent(axis,t,ang){ return add(scale(t,Math.cos(ang)), scale(cross(axis,t),Math.sin(ang))); }
function slerp(a,b,t){ const th = Math.acos(clamp(dot(a,b),-1,1)); if(th<1e-6) return a; const s = Math.sin(th); return norm(add(scale(a,Math.sin((1-t)*th)/s), scale(b,Math.sin(t*th)/s))); }

function compute(){
  const sgn = state.hand==='L' ? -1 : 1;
  const Pin = norm(V(0, Math.SQRT1_2, Math.SQRT1_2));
  const refDir = norm(V(0, -Math.SQRT1_2, Math.SQRT1_2));
  const refDist = state.core==='asym' ? 6 : 3.5;
  const refPoint = move(Pin, refDir, refDist);
  const drillSign = state.hand==='L' ? -1 : 1;
  const pinPapDir = rotTangent(Pin, refDir, drillSign*rad(state.A));
  const P = move(Pin, pinPapDir, state.D);
  const tPapPin = tangentTo(Pin, P);
  const pinDirP = tangentTo(P, Pin);
  const valSign = state.hand==='L' ? 1 : -1;
  const eValP = rotTangent(P, pinDirP, valSign*rad(state.C));
  const valA = move(P, eValP, -1.2);
  const valB = move(P, eValP, 3.0);
  const cenDirGrip = norm(scale(cross(P, eValP), sgn));
  const cenA = P;
  const cenB = move(P, cenDirGrip, 6);
  const grip = move(P, cenDirGrip, 5);
  const fingerDir = tangentTo(grip, V(0,1,0));
  const fingerMid = move(grip, fingerDir, 2.25);
  const thumb = move(grip, fingerDir, -2.25);
  const eValFinger = norm(add(scale(grip,-Math.sin(2.25/RB)), scale(fingerDir,Math.cos(2.25/RB))));
  const eMidFinger = norm(cross(eValFinger, fingerMid));
  const finger1 = move(fingerMid, eMidFinger, -0.38);
  const finger2 = move(fingerMid, eMidFinger, 0.38);
  return {P,Pin,refPoint,refDir,tPapPin,pinDirP,eValP,grip,fingerMid,thumb,finger1,finger2,valA,valB,cenA,cenB};
}
function viewRot(p){
  const cx = Math.cos(state.rotX), sx = Math.sin(state.rotX);
  let y1 = p.y*cx - p.z*sx, z1 = p.y*sx + p.z*cx, x1 = p.x;
  const cy = Math.cos(state.rotY), sy = Math.sin(state.rotY);
  return V(x1*cy + z1*sy, y1, -x1*sy + z1*cy);
}
function render(){
  const pts = compute();
  if(state.rotY===null){ state.rotY = Math.atan2(-pts.Pin.x, pts.Pin.z); state.rotX = 0; }
  const cv = $('ball');
  const dpr = window.devicePixelRatio||1;
  const css = cv.clientWidth||360;
  cv.width = css*dpr; cv.height = css*dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = css, H = css, cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 20;
  const proj = p => { const v = viewRot(p); return {x: cx + v.x*R, y: cy - v.y*R, z: v.z}; };
  const grad = ctx.createRadialGradient(cx-R*0.35, cy-R*0.35, R*0.1, cx, cy, R);
  grad.addColorStop(0,'#b3d9ff'); grad.addColorStop(0.22,'#2196f3'); grad.addColorStop(0.55,'#1565c0'); grad.addColorStop(0.85,'#0d2a5e'); grad.addColorStop(1,'#051a3a');
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle = grad; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha = 0.16; ctx.strokeStyle = '#000'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.ellipse(cx-R*0.2, cy+R*0.1, R*0.7, R*0.25, -0.3, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx-R*0.35, cy-R*0.35, R*0.28, R*0.18, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  function drawArc(a,b,color,width,dash){
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.setLineDash(dash||[]);
    let started = false;
    for(let i=0;i<=48;i++){
      const p = slerp(a,b,i/48); const q = proj(p);
      if(q.z<=0.02){ started = false; continue; }
      if(!started){ ctx.beginPath(); ctx.moveTo(q.x,q.y); started = true; }
      else ctx.lineTo(q.x,q.y);
    }
    if(started) ctx.stroke();
    ctx.setLineDash([]);
  }
  function arcAt(center, dir1, dir2, radiusIn, color, width){
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.setLineDash([]);
    ctx.beginPath(); let started = false;
    for(let i=0;i<=32;i++){
      const t = i/32;
      const d = norm(add(scale(dir1,1-t), scale(dir2,t)));
      const p = move(center, d, radiusIn); const q = proj(p);
      if(q.z<=0.02){ started = false; continue; }
      if(!started){ ctx.moveTo(q.x,q.y); started = true; } else ctx.lineTo(q.x,q.y);
    }
    if(started) ctx.stroke();
  }
  function dotAt(p, color, r, ring){
    const q = proj(p); if(q.z<=0.02) return q;
    ctx.beginPath(); ctx.arc(q.x,q.y,r,0,Math.PI*2); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#111'; ctx.stroke();
    if(ring){ ctx.beginPath(); ctx.arc(q.x,q.y,r+7,0,Math.PI*2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    return q;
  }
  function holeAt(p, rIn){
    const q = proj(p); if(q.z<=0.05) return;
    const r = Math.sin(rIn/RB)*R;
    ctx.beginPath(); ctx.arc(q.x,q.y,Math.max(r,8),0,Math.PI*2); ctx.fillStyle = '#050505'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#333'; ctx.stroke();
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(q.x-r*0.25, q.y-r*0.25, r*0.35, r*0.2, -0.4, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  }
  function labelAt(p, text, dx, dy){
    const q = proj(p); if(q.z<=-0.2) return;
    let x = q.x + dx, y = q.y + dy;
    const d = Math.hypot(x-cx, y-cy);
    if(d > R-14){ const s = (R-14)/d; x = cx + (x-cx)*s; y = cy + (y-cy)*s; }
    x = clamp(x, 14, W-14); y = clamp(y, 16, H-10);
    ctx.font = '700 14px -apple-system, "Noto Sans KR", sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.strokeText(text, x, y);
    ctx.fillStyle = '#fff'; ctx.fillText(text, x, y);
  }
  const coreLabel = state.core==='asym' ? 'MB' : 'CG';
  drawArc(pts.valA, pts.valB, '#ffffff', 1.5, []);
  drawArc(pts.cenA, pts.cenB, '#ffffff', 1.5, []);
  drawArc(pts.Pin, pts.P, '#ffffff', 1.5, []);
  if(state.core==='sym') drawArc(pts.Pin, pts.refPoint, '#ffffff', 2, []);
  else drawArc(pts.Pin, pts.refPoint, '#ffffff', 2, [7,5]);
  drawArc(pts.thumb, pts.fingerMid, 'rgba(255,255,255,0.55)', 1.5, [4,4]);
  arcAt(pts.P, pts.pinDirP, pts.eValP, 0.9, '#ffffff', 2);
  arcAt(pts.Pin, pts.tPapPin, pts.refDir, 0.9, '#ffffff', 2);
  const HL = '#ff2d2d';
  if(state.highlight==='A'){ arcAt(pts.Pin, pts.tPapPin, pts.refDir, 0.9, HL, 5); }
  else if(state.highlight==='D'){ drawArc(pts.Pin, pts.P, HL, 5, []); }
  else if(state.highlight==='C'){ arcAt(pts.P, pts.pinDirP, pts.eValP, 0.9, HL, 5); }
  holeAt(pts.finger1, 0.42); holeAt(pts.finger2, 0.42); holeAt(pts.thumb, 0.55);
  dotAt(pts.P, '#ffffff', 5, true);
  dotAt(pts.Pin, '#ffd400', 10, false);
  dotAt(pts.grip, '#ffffff', 4, false);
  dotAt(pts.refPoint, '#ffffff', 8, false);
  labelAt(pts.Pin, '핀', 12, -12);
  labelAt(pts.P, 'Pin to PAP', 14, 4);
  {
    const q = proj(pts.refPoint); const vx = cx-q.x, vy = cy-q.y; const l = Math.hypot(vx,vy)||1;
    labelAt(pts.refPoint, coreLabel, vx/l*18, vy/l*18-6);
  }
  {
    const d1 = norm(add(pts.pinDirP, pts.eValP));
    const mid = move(pts.P, d1, 1.6);
    labelAt(mid, 'VAL ' + state.C + '°', 6, -6);
    const d2 = norm(add(pts.tPapPin, pts.refDir));
    const mid2 = move(pts.Pin, d2, 1.6);
    labelAt(mid2, state.A + '°', 6, -6);

  }
  const labels = {A:'드릴링 앵글 ' + state.A + '°', D:'Pin to PAP ' + state.D + '″', C:'VAL 앵글 ' + state.C + '°'};
  const hlEl = $('hlLabel');
  if(state.highlight && labels[state.highlight]){ hlEl.textContent = labels[state.highlight]; hlEl.classList.remove('hint'); }
  else { hlEl.textContent = '공을 드래그하면 돌아가 · 보기 버튼을 누르면 키보드 없이 선만 빨개져'; hlEl.classList.add('hint'); }
  $('cardA').classList.toggle('hl', state.highlight==='A');
  $('cardD').classList.toggle('hl', state.highlight==='D');
  $('cardC').classList.toggle('hl', state.highlight==='C');
  $('viewA').classList.toggle('active', state.highlight==='A');
  $('viewD').classList.toggle('active', state.highlight==='D');
  $('viewC').classList.toggle('active', state.highlight==='C');
  $('lrL').classList.toggle('active', state.hand==='L');
  $('lrR').classList.toggle('active', state.hand==='R');
  $('coreSym').classList.toggle('active', state.core==='sym');
  $('coreAsym').classList.toggle('active', state.core==='asym');
  const ae = document.activeElement;
  if(ae!==$('inA')) $('inA').value = state.A;
  if(ae!==$('inD')) $('inD').value = state.D;
  if(ae!==$('inC')) $('inC').value = state.C;
  [['inA',state.A],['inD',state.D],['inC',state.C]].forEach(([id,v])=>{
    const el = $(id);
    const src = el===ae ? el.value : String(v);
    el.style.width = Math.max(2, src.length + 0.5) + 'ch';
  });
}
function bindNum(id, key, hl){
  const el = $(id);
  el.addEventListener('focus', ()=>{ state.highlight = hl; render(); });
  el.addEventListener('input', ()=>{
    el.style.width = Math.max(2, el.value.length + 0.5) + 'ch';
    const v = parseFloat(el.value);
    if(!isNaN(v)){ state[key] = v; save(); }
    state.highlight = hl; render();
  });
}
bindNum('inA','A','A'); bindNum('inD','D','D'); bindNum('inC','C','C');
function bindView(id, hl){ $(id).addEventListener('click', ()=>{ state.highlight = hl; render(); }); }
bindView('viewA','A'); bindView('viewD','D'); bindView('viewC','C');
$('lrL').addEventListener('click', ()=>{ state.hand='L'; state.rotY=null; save(); render(); });
$('lrR').addEventListener('click', ()=>{ state.hand='R'; state.rotY=null; save(); render(); });
$('coreSym').addEventListener('click', ()=>{ state.core='sym'; save(); render(); });
$('coreAsym').addEventListener('click', ()=>{ state.core='asym'; save(); render(); });
$('rotReset').addEventListener('click', ()=>{ state.rotY=null; state.rotX=0; render(); });
const cv = $('ball');
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; try{ cv.setPointerCapture(e.pointerId); }catch(err){} });
cv.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY; lastX = e.clientX; lastY = e.clientY;
  state.rotY += dx*0.006; state.rotX = clamp(state.rotX + dy*0.006, -1.3, 1.3);
  render();
});
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, ()=>{ dragging = false; }));
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
